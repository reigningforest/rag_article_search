[project]
name = "rag-article-search"
version = "0.1.2"
description = "An advanced Retrieval-Augmented Generation (RAG) system."
authors = [{ name = "John He", email = "johnhe@u.northwestern.edu" }]
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "kagglehub>=1.0.3",
    "pandas>=3.1.0",
    "tqdm>=4.70.1",
    "numpy>=2.4.6",
    "streamlit>=1.66.1",
    "fastembed>=0.9.1",
    "onnxruntime>=1.31.1",
    "langchain>=1.4.8",
    "langchain-text-splitters>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-core>=1.7.4",
    "pinecone>=7.3.0",
    "langgraph>=1.2.19",
    "pytest>=9.2.0",
    "google-genai>=2.34.0",
    "peft>=0.21.2",
    "transformers>=5.22.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ipykernel>=7.4.0",
]
gpu = [
    "onnxruntime-gpu>=1.31.1",
    "torch>=2.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
